services:
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: mytidecloak
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=password
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./tidecloak-init/blindvault-realm.json:/opt/keycloak/data/import/blindvault-realm.json:ro
    restart: unless-stopped

  blindvault-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blindvault-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_TIDECLOAK_URL=http://localhost:8080
    depends_on:
      - tidecloak
    restart: unless-stopped
